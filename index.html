<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONE 1 | PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --p: #6c5ce7; --bg: #ffffff; --gray: #f8f9fa; --text: #1a1a1a; --red: #ff4757; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; overflow-x: hidden; }
        
        /* شاشة التحميل */
        #loading-screen { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .loader { width: 35px; height: 35px; border: 3px solid #eee; border-top-color: var(--p); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* الهيدر */
        header { padding: 10px 15px; display: flex; align-items: center; gap: 12px; background: #fff; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #f0f0f0; }
        .site-logo-text { font-size: 20px; font-weight: 900; color: var(--p); letter-spacing: 1px; }
        .search-bar { flex: 1; background: var(--gray); border-radius: 20px; padding: 8px 15px; display: flex; align-items: center; }
        .search-bar input { border: none; background: none; width: 100%; outline: none; font-size: 14px; margin-right: 8px; }
        .w-btn { width: 38px; height: 38px; background: var(--p); color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; }

        .page { display: none; padding: 15px; animation: fadeIn 0.3s ease; min-height: calc(100vh - 160px); }
        .page.active { display: flex; flex-direction: column; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* تصميم البروفايل الاحترافي */
        .profile-header { text-align: center; padding: 20px 0; position: relative; }
        .avatar-wrapper { position: relative; width: 100px; height: 100px; margin: 0 auto 15px; }
        .profile-img { width: 100%; height: 100%; background: #ddd; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); object-fit: cover; }
        .edit-avatar-btn { position: absolute; bottom: 0; right: 0; background: var(--p); color: #fff; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; cursor: pointer; font-size: 12px; }
        
        .user-stats { display: flex; justify-content: center; gap: 30px; margin: 20px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 15px 0; }
        .stat-item { text-align: center; }
        .stat-item span { display: block; font-weight: bold; font-size: 18px; }
        .stat-item label { font-size: 12px; color: #888; }

        .v-badge { color: var(--p); margin-right: 5px; font-size: 1.2rem; vertical-align: middle; }

        /* التبويبات الداخلية للبروفايل */
        .profile-tabs { display: flex; border-bottom: 1px solid #eee; margin-bottom: 15px; }
        .p-tab { flex: 1; text-align: center; padding: 10px; color: #888; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; }
        .p-tab.active { color: var(--p); border-bottom-color: var(--p); font-weight: bold; }

        /* استايل الإعدادات */
        .settings-list { display: flex; flex-direction: column; gap: 10px; }
        .setting-row { background: var(--gray); padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .setting-row:active { transform: scale(0.98); }
        .setting-row i { width: 20px; color: #555; }
        .setting-row span { flex: 1; font-size: 14px; }
        .setting-row.danger { color: var(--red); }
        .setting-row.danger i { color: var(--red); }

        /* التنقل السفلي */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 1000; align-items: center; }
        .nav-item { color: #bbb; font-size: 24px; cursor: pointer; }
        .nav-item.active { color: var(--p); }
        .plus-btn { background: var(--p); width: 55px; height: 55px; border-radius: 50%; color: #fff !important; display: flex; align-items: center; justify-content: center; margin-top: -45px; border: 4px solid #fff; box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3); }

        /* الدعم الفني في الرسائل */
        .support-container { margin-top: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .support-link { background: var(--gray); border-radius: 15px; padding: 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="loader"></div></div>

    <header>
        <div class="site-logo-text">ONE 1</div>
        <div class="search-bar">
            <i class="fa fa-search" style="color:#aaa;"></i>
            <input type="text" placeholder="ابحث في وان 1...">
        </div>
        <div class="w-btn">W</div>
    </header>

    <div id="home" class="page active">
        <div style="text-align:center; margin-top:100px; color:#bbb;">
            <i class="fa-solid fa-store" style="font-size:50px; opacity:0.3;"></i>
            <p>لا توجد منتجات معروضة حالياً</p>
        </div>
    </div>

    <div id="fav" class="page">
        <h3 style="text-align: center; color: #888; margin-top: 50px;">المفضلة فارغة</h3>
    </div>

    <div id="chat" class="page">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa;">
            <p>لا توجد محادثات نشطة</p>
        </div>
        <div class="support-container">
            <a href="https://wa.me/972592738901" class="support-link">
                <div style="width:35px;height:35px;background:#25D366;color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;"><i class="fa-brands fa-whatsapp"></i></div>
                <div class="support-text"><h4>تواصل عبر واتساب</h4><p>رد سريع من فريق الدعم</p></div>
            </a>
            <a href="mailto:sw803812@gmail.com" class="support-link">
                <div style="width:35px;height:35px;background:var(--p);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;"><i class="fa-regular fa-envelope"></i></div>
                <div class="support-text"><h4>البريد الإلكتروني</h4><p>sw803812@gmail.com</p></div>
            </a>
        </div>
    </div>

    <div id="profile" class="page">
        <div class="profile-header">
            <div class="avatar-wrapper">
                <img src="https://via.placeholder.com/100" class="profile-img" id="userImg">
                <div class="edit-avatar-btn"><i class="fa fa-camera"></i></div>
            </div>
            <h2 id="uName" style="margin: 5px 0;">...</h2>
            <p id="uEmail" style="color:#888; font-size: 13px; margin: 0;"></p>
        </div>

        <div class="user-stats">
            <div class="stat-item"><span>0</span><label>منشورات</label></div>
            <div class="stat-item"><span>0</span><label>متابعين</label></div>
            <div class="stat-item"><span>0</span><label>تقييم</label></div>
        </div>

        <div class="profile-tabs">
            <div class="p-tab active" onclick="switchProfileTab('posts', this)">منشوراتي</div>
            <div class="p-tab" onclick="switchProfileTab('settings', this)">الإعدادات</div>
        </div>

        <div id="tab-posts" class="tab-content">
            <p style="text-align: center; color: #aaa; margin-top: 30px;">لم تنشر أي شيء بعد.</p>
        </div>

        <div id="tab-settings" class="tab-content" style="display: none;">
            <div class="settings-list">
                <div class="setting-row">
                    <i class="fa fa-user-pen"></i><span>تعديل الاسم والبيانات</span><i class="fa fa-chevron-left" style="font-size:10px;"></i>
                </div>
                <div class="setting-row">
                    <i class="fa fa-lock"></i><span>تغيير كلمة المرور</span><i class="fa fa-chevron-left" style="font-size:10px;"></i>
                </div>
                <div class="setting-row">
                    <i class="fa fa-bell"></i><span>إعدادات الإشعارات</span><i class="fa fa-chevron-left" style="font-size:10px;"></i>
                </div>
                <div class="setting-row danger" id="outBtn">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i><span>تسجيل الخروج</span>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="go('home', this)"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="go('fav', this)"><i class="fa-regular fa-heart"></i></div>
        <div class="nav-item plus-btn"><i class="fa fa-plus"></i></div>
        <div class="nav-item" onclick="go('chat', this)"><i class="fa-regular fa-comment-dots"></i></div>
        <div class="nav-item" onclick="go('profile', this)"><i class="fa-regular fa-user"></i></div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const conf = { 
            apiKey: "AIzaSyDj1jWQZHnELXe_eFkfGpi3F3_jPGhPm7I", 
            authDomain: "one1-95c0e.firebaseapp.com", 
            projectId: "one1-95c0e", 
            appId: "1:1090900617422:web:f6e9c11bb7a090c39ec89f" 
        };

        const app = initializeApp(conf);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('loading-screen').style.display = 'none';
                try {
                    const s = await getDoc(doc(db, "users", user.uid));
                    if (s.exists()) {
                        const d = s.data();
                        const badge = d.isVerified ? ' <i class="fa-solid fa-patch-check v-badge"></i>' : '';
                        document.getElementById('uName').innerHTML = (d.name || "مستخدم ONE 1") + badge;
                        document.getElementById('uEmail').innerText = d.email;
                    }
                } catch (e) { console.log(e); }
            } else {
                window.location.href = "auth.html";
            }
        });

        // التنقل بين الصفحات الرئيسية
        window.go = (id, el) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        };

        // التنقل بين تبويبات البروفايل
        window.switchProfileTab = (tab, el) => {
            document.querySelectorAll('.p-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            el.classList.add('active');
            document.getElementById('tab-' + tab).style.display = 'block';
        };

        document.getElementById('outBtn').onclick = () => signOut(auth);
    </script>
</body>
</html>
