<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONE 1 | OFFICIAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --p: #6c5ce7; --bg: #ffffff; --gray: #f8f9fa; --text: #1a1a1a; --gold: #f1c40f; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; overflow-x: hidden; }

        /* شاشة التحميل */
        #loading-screen { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .loader { width: 35px; height: 35px; border: 3px solid #eee; border-top-color: var(--p); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* الهيدر الاحترافي */
        header { padding: 10px 15px; display: flex; align-items: center; gap: 12px; background: #fff; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #f0f0f0; }
        .site-logo { font-size: 20px; font-weight: 900; color: var(--p); letter-spacing: 1px; }
        .search-bar { flex: 1; background: var(--gray); border-radius: 20px; padding: 8px 15px; display: flex; align-items: center; }
        .search-bar input { border: none; background: none; width: 100%; outline: none; font-size: 14px; }
        .w-btn { width: 38px; height: 38px; background: var(--p); color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; }

        .page { display: none; padding: 15px; animation: fadeIn 0.3s ease; min-height: calc(100vh - 160px); }
        .page.active { display: flex; flex-direction: column; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* البروفايل المطور */
        .profile-header { text-align: center; padding: 20px 0; }
        .avatar-container { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; cursor: pointer; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--p); background: #eee; }
        .camera-overlay { position: absolute; bottom: 5px; right: 5px; background: var(--p); color: #fff; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; border: 2px solid #fff; }
        
        .stars { color: var(--gold); font-size: 18px; margin: 8px 0; }
        .v-badge { color: var(--p); margin-right: 5px; font-size: 1.2rem; vertical-align: middle; }

        /* أزرار الدعم المصغرة */
        .support-mini-grid { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 20px; }
        .mini-btn { padding: 10px; border-radius: 12px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; font-weight: bold; border: 1px solid #eee; background: var(--gray); color: #555; }
        .mini-btn i { font-size: 16px; }

        /* التنقل */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 1000; align-items: center; }
        .nav-item { color: #bbb; font-size: 24px; cursor: pointer; }
        .nav-item.active { color: var(--p); }
        .plus-btn { background: var(--p); width: 55px; height: 55px; border-radius: 50%; color: #fff !important; display: flex; align-items: center; justify-content: center; margin-top: -45px; border: 4px solid #fff; box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3); }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="loader"></div></div>

    <header>
        <div class="site-logo">ONE 1</div>
        <div class="search-bar"><input type="text" placeholder="ابحث في وان 1..."></div>
        <div class="w-btn">W</div>
    </header>

    <div id="home" class="page active">
        <div style="text-align:center; margin-top:50px; color:#ccc;">لا توجد منشورات حالياً</div>
    </div>

    <div id="chat" class="page">
        <div style="flex:1; display:flex; align-items:center; justify-content:center; color:#aaa;">لا توجد رسائل</div>
        <div class="support-mini-grid">
            <a href="https://wa.me/972592738901" class="mini-btn"><i class="fa-brands fa-whatsapp" style="color:#25D366;"></i> واتساب</a>
            <a href="mailto:sw803812@gmail.com" class="mini-btn"><i class="fa-regular fa-envelope" style="color:var(--p);"></i> إيميل</a>
        </div>
    </div>

    <div id="profile" class="page">
        <div class="profile-header">
            <div class="avatar-container" onclick="document.getElementById('fileInput').click()">
                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="profile-img" id="userAvatar">
                <div class="camera-overlay"><i class="fa fa-camera"></i></div>
                <input type="file" id="fileInput" hidden accept="image/*">
            </div>
            <h2 id="realName">...</h2>
            <div class="stars">
                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i>
            </div>
            <p id="userMail" style="color:#888; font-size:13px;"></p>
        </div>
        <button onclick="logout()" style="margin-top:20px; color:red; border:none; background:none; font-weight:bold; cursor:pointer;">تسجيل الخروج</button>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="go('home', this)"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item plus-btn"><i class="fa fa-plus"></i></div>
        <div class="nav-item" onclick="go('chat', this)"><i class="fa-regular fa-comment-dots"></i></div>
        <div class="nav-item" onclick="go('profile', this)"><i class="fa-regular fa-user"></i></div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const conf = { 
            apiKey: "AIzaSyDj1jWQZHnELXe_eFkfGpi3F3_jPGhPm7I", 
            authDomain: "one1-95c0e.firebaseapp.com", 
            projectId: "one1-95c0e", 
            storageBucket: "one1-95c0e.appspot.com",
            appId: "1:1090900617422:web:f6e9c11bb7a090c39ec89f" 
        };

        const app = initializeApp(conf);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('loading-screen').style.display = 'none';
                const s = await getDoc(doc(db, "users", user.uid));
                if (s.exists()) {
                    const d = s.data();
                    const badge = d.isVerified ? ' <i class="fa-solid fa-patch-check v-badge"></i>' : '';
                    document.getElementById('realName').innerHTML = d.name + badge;
                    document.getElementById('userMail').innerText = d.email;
                    if(d.profilePic) document.getElementById('userAvatar').src = d.profilePic;
                }
            } else { window.location.href = "auth.html"; }
        });

        // نظام رفع الصور الحقيقي
        document.getElementById('fileInput').onchange = async (e) => {
            const file = e.target.files[0];
            if(!file || !auth.currentUser) return;
            
            const loader = document.getElementById('loading-screen');
            loader.style.display = 'flex'; // إظهار التحميل أثناء الرفع

            const sRef = ref(storage, `profiles/${auth.currentUser.uid}`);
            await uploadBytes(sRef, file);
            const url = await getDownloadURL(sRef);
            
            await updateDoc(doc(db, "users", auth.currentUser.uid), { profilePic: url });
            document.getElementById('userAvatar').src = url;
            loader.style.display = 'none';
        };

        window.go = (id, el) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) el.classList.add('active');
        };

        window.logout = () => signOut(auth);
    </script>
</body>
</html>
