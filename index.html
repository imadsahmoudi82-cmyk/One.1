<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONE 1 | OFFICIAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --p: #6c5ce7; --bg: #ffffff; --gray: #f8f9fa; --text: #1a1a1a; --gold: #f1c40f; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; overflow-x: hidden; }

        /* شاشة التحميل */
        #loading-screen { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .loader { width: 35px; height: 35px; border: 3px solid #eee; border-top-color: var(--p); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* الهيدر */
        header { padding: 10px 15px; display: flex; align-items: center; gap: 12px; background: #fff; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #f0f0f0; }
        .site-logo { font-size: 20px; font-weight: 900; color: var(--p); letter-spacing: 1px; }
        .search-bar { flex: 1; background: var(--gray); border-radius: 20px; padding: 8px 15px; display: flex; align-items: center; }
        .search-bar input { border: none; background: none; width: 100%; outline: none; font-size: 14px; width: 100%; }
        .w-btn { width: 38px; height: 38px; background: var(--p); color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }

        /* الصفحات */
        .page { display: none; padding: 15px; animation: fadeIn 0.3s ease; min-height: calc(100vh - 160px); flex-direction: column; }
        .page.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* البروفايل والإعدادات */
        .profile-header { text-align: center; padding: 20px 0; }
        .avatar-container { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--p); background: #eee; }
        .stars { color: var(--gold); font-size: 16px; margin: 8px 0; }
        .v-badge { color: var(--p); margin-right: 5px; font-size: 1.1rem; vertical-align: middle; }

        .settings-list { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
        .setting-row { background: var(--gray); padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .setting-row i { width: 20px; color: #555; }
        .setting-row span { flex: 1; font-size: 14px; }
        .setting-row.danger { color: #ff4757; }

        /* أزرار الدعم */
        .support-mini-grid { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px 0; }
        .mini-btn { padding: 12px; border-radius: 12px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; font-weight: bold; background: var(--gray); color: #555; border: 1px solid #eee; }

        /* التنقل السفلي */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 1000; align-items: center; }
        .nav-item { color: #bbb; font-size: 24px; cursor: pointer; }
        .nav-item.active { color: var(--p); }
        .plus-btn { background: var(--p); width: 55px; height: 55px; border-radius: 50%; color: #fff !important; display: flex; align-items: center; justify-content: center; margin-top: -45px; border: 4px solid #fff; box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3); }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="loader"></div></div>

    <header>
        <div class="site-logo">ONE 1</div>
        <div class="search-bar"><input type="text" placeholder="ابحث في وان 1..."></div>
        <div class="w-btn">W</div>
    </header>

    <div id="home" class="page active">
        <div style="text-align:center; margin-top:100px; color:#ccc;">لا توجد منشورات حالياً</div>
    </div>

    <div id="chat" class="page">
        <div style="flex:1; display:flex; align-items:center; justify-content:center; color:#aaa;">لا توجد رسائل</div>
        <div class="support-mini-grid">
            <a href="https://wa.me/972592738901" class="mini-btn"><i class="fa-brands fa-whatsapp" style="color:#25D366;"></i> واتساب</a>
            <a href="mailto:sw803812@gmail.com" class="mini-btn"><i class="fa-regular fa-envelope" style="color:var(--p);"></i> إيميل</a>
        </div>
    </div>

    <div id="profile" class="page">
        <div class="profile-header">
            <div class="avatar-container">
                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="profile-img" id="userAvatar">
            </div>
            <h2 id="realName">جاري التحميل...</h2>
            <div class="stars">
                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
            </div>
            <p id="userMail" style="color:#888; font-size:13px;"></p>
        </div>

        <div class="settings-list">
            <div class="setting-row" id="editNameBtn"><i class="fa fa-user-pen"></i><span>تعديل الاسم</span></div>
            <div class="setting-row" id="resetPassBtn"><i class="fa fa-lock"></i><span>تغيير كلمة المرور</span></div>
            <div class="setting-row danger" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>تسجيل الخروج</span></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item plus-btn"><i class="fa fa-plus"></i></div>
        <div class="nav-item" id="nav-chat"><i class="fa-regular fa-comment-dots"></i></div>
        <div class="nav-item" id="nav-profile"><i class="fa-regular fa-user"></i></div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDj1jWQZHnELXe_eFkfGpi3F3_jPGhPm7I",
            authDomain: "one1-95c0e.firebaseapp.com",
            projectId: "one1-95c0e",
            storageBucket: "one1-95c0e.appspot.com",
            appId: "1:1090900617422:web:f6e9c11bb7a090c39ec89f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // مراقبة حالة المستخدم
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('loading-screen').style.display = 'none';
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    const badge = data.isVerified ? ' <i class="fa-solid fa-patch-check v-badge"></i>' : '';
                    document.getElementById('realName').innerHTML = (data.name || "مستخدم") + badge;
                    document.getElementById('userMail').innerText = user.email;
                    if(data.profilePic) document.getElementById('userAvatar').src = data.profilePic;
                }
            } else {
                window.location.href = "auth.html";
            }
        });

        // وظائف التنقل
        const pages = ['home', 'chat', 'profile'];
        function showPage(pageId) {
            pages.forEach(p => document.getElementById(p).classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        document.getElementById('nav-home').onclick = (e) => { showPage('home'); e.currentTarget.classList.add('active'); };
        document.getElementById('nav-chat').onclick = (e) => { showPage('chat'); e.currentTarget.classList.add('active'); };
        document.getElementById('nav-profile').onclick = (e) => { showPage('profile'); e.currentTarget.classList.add('active'); };

        // وظيفة تعديل الاسم
        document.getElementById('editNameBtn').onclick = async () => {
            const newName = prompt("أدخل الاسم الجديد:");
            if (newName && auth.currentUser) {
                await updateDoc(doc(db, "users", auth.currentUser.uid), { name: newName });
                location.reload();
            }
        };

        // وظيفة تغيير كلمة المرور
        document.getElementById('resetPassBtn').onclick = () => {
            sendPasswordResetEmail(auth, auth.currentUser.email)
                .then(() => alert("تم إرسال رابط التغيير لبريدك!"))
                .catch(err => alert(err.message));
        };

        // تسجيل الخروج
        document.getElementById('logoutBtn').onclick = () => signOut(auth);

    </script>
</body>
</html>
